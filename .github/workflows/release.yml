name: Release images

# Builds the server + client images and pushes them to GitHub Container
# Registry on every push to main. The VPS (or Watchtower) then pulls
# ghcr.io/tomasneto404/cveaver-{server,client}:latest — no building on the host.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: tomasneto404 # GHCR namespaces must be lowercase

jobs:
  server:
    name: Build & push server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/cveaver-server:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/cveaver-server:${{ github.sha }}

  client:
    name: Build & push client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./client
          push: true
          # Vite bakes these at build time. VITE_STRIPE_PUBLISHABLE_KEY comes
          # from a repo variable (publishable key is safe to embed); swap to the
          # live pk_ when going out of beta.
          build-args: |
            VITE_API_URL=https://api.cveaver.com
            VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
            VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}
            VITE_UMAMI_SRC=${{ vars.VITE_UMAMI_SRC }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/cveaver-client:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/cveaver-client:${{ github.sha }}
