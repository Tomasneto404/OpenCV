name: Release images

# Invoked only after CI passes. Never publish an untested push independently.
on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        description: Docker Hub access token for tomasneto26 with Read and Write permissions
        required: true

permissions:
  contents: read

jobs:
  images:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read application version
        id: version
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { version } = require('./package.json');
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error('package.json must contain a Docker-compatible semantic version');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `value=${version}\n`);
          NODE
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add the DOCKERHUB_TOKEN repository secret for Docker Hub user tomasneto26."
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: tomasneto26
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            tomasneto26/opencv-${{ matrix.service }}:latest
            tomasneto26/opencv-${{ matrix.service }}:${{ steps.version.outputs.value }}
            tomasneto26/opencv-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=OpenCV ${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
