# Tiny Docker API proxy for Traefik.
#
# Why: recent Docker daemons (Engine 29+) reject API < 1.40, but Traefik's
# bundled Docker client speaks 1.24 and ignores DOCKER_API_VERSION — so it gets
# "client version 1.24 is too old" / HTTP 400. This nginx sits between Traefik
# and the socket and rewrites the version segment of every request to a version
# the daemon accepts, so no daemon-side change is needed.
#
# nginx runs as root so its workers can read the root-owned docker socket.
user root;
worker_processes 1;
events { worker_connections 1024; }

http {
  access_log off;

  upstream dockerd {
    server unix:/var/run/docker.sock;
  }

  server {
    listen 2375;

    location / {
      # /v1.24/containers/json → /v1.44/containers/json ; unversioned paths pass through.
      rewrite ^/v[0-9]+\.[0-9]+/(.*)$ /v1.44/$1 break;
      proxy_pass http://dockerd;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Docker /events is a long-lived stream — don't buffer.
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
