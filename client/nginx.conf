# Nginx config for the CVeaver SPA.
# Listens on 8080 (non-privileged) so we can run as non-root.
# Traefik handles TLS and the public-facing hostname.

server {
  listen      8080 default_server;
  server_name _;
  root        /usr/share/nginx/html;
  index       index.html;

  # Drop the server token + sniff defenses.
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options        "DENY"   always;
  add_header Referrer-Policy        "no-referrer" always;
  add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

  # Tight CSP. The only 3rd-party JS is self-hosted Umami analytics
  # (analytics.cveaver.com) — cookieless, no inline scripts (it's loaded via a
  # <script src> injected by the app). Stripe checkout is a same-tab redirect
  # (not iframed), no script eval. Inline styles allowed because Tailwind v4
  # emits inline classes via the generated stylesheet (self-hosted, no inline).
  # NOTE: keep script-src/connect-src below in sync with VITE_UMAMI_SRC.
  add_header Content-Security-Policy
    "default-src 'self'; \
     base-uri 'self'; \
     frame-ancestors 'none'; \
     img-src 'self' data: blob:; \
     font-src 'self' https://fonts.gstatic.com data:; \
     style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; \
     script-src 'self' https://analytics.cveaver.com; \
     connect-src 'self' https://api.cveaver.com https://*.cveaver.com https://api.stripe.com https://analytics.cveaver.com; \
     form-action 'self' https://checkout.stripe.com; \
     object-src 'none'; \
     worker-src 'self' blob:; \
     upgrade-insecure-requests"
    always;

  # Strict transport security — Traefik terminates TLS, but we still emit
  # the header so clients enforce HTTPS on next visits.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/xml+rss application/atom+xml image/svg+xml
             application/wasm font/woff2;

  # Health endpoint for Docker healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Long cache for hashed assets (vite emits content-hashed filenames).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Worker script (pdfjs) — hashed too.
  location ~* \.(?:woff2?|ttf|otf|webp|png|jpg|jpeg|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }

  # SPA fallback — every other path goes to index.html, but index.html
  # itself is no-store so the user always gets the latest bundle URLs.
  location = /index.html {
    add_header Cache-Control "no-store" always;
    expires off;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
