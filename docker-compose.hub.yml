# Standalone deployment using the images published by CI.
name: opencv
services:
  server:
    image: ${DOCKERHUB_USER:-tomasneto26}/opencv-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      SIGN_KEY_DIR: /app/server/keys
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
      TRUST_PROXY: 1
    volumes:
      - opencv-keys:/app/server/keys
    expose:
      - '3001'
  client:
    image: ${DOCKERHUB_USER:-tomasneto26}/opencv-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      server:
        condition: service_healthy
volumes:
  opencv-keys:
