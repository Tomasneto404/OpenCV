server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 80m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:" always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location = /healthz { access_log off; return 200 'ok'; }
  location /api/ {
    proxy_pass http://server:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
  location ~* \.mjs$ { types {} default_type application/javascript; expires 1y; }
  location /assets/ { expires 1y; try_files $uri =404; }
  location = /index.html { add_header Cache-Control no-store; }
  location / { try_files $uri $uri/ /index.html; }
}
