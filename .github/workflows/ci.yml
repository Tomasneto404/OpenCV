name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build # tsc -b (typecheck) && vite build
        working-directory: client
        env:
          VITE_API_URL: https://api.cveaver.com
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
        env:
          # Dummy values just to satisfy the `:?` required-var checks.
          DOMAIN: cveaver.com
          ACME_EMAIL: ci@cveaver.com
          STRIPE_SECRET_KEY: sk_test_ci

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free for personal accounts; orgs need GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
