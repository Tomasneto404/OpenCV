# Build and test locally: docker compose -f docker-compose.yml up -d --build --wait
name: opencv
services:
  opencv:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - '${WEB_PORT:-8080}:8080'
