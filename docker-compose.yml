services:

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PAYMENT_METHODS: ${STRIPE_PAYMENT_METHODS:-card,multibanco}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      PORT: 3001
      DATA_DIR: /data
    volumes:
      - easycv_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  easycv_data:
