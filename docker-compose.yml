# Build and test locally: docker compose -f docker-compose.yml up -d --build --wait
name: opencv
services:
  opencv:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - opencv-data:/app/data
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_LABEL: ${OIDC_LABEL:-SSO}
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - '${WEB_PORT:-8080}:8080'
volumes:
  opencv-data:
