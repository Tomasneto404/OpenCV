<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenCV — Cria, personaliza e descarrega o teu CV gratuitamente. Nove templates, sem registo e sem marcas de água." />
    <title>OpenCV — O teu próximo capítulo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      /* Theme bootstrap — set data-theme BEFORE React mounts to avoid FOUC.
         Order of preference: localStorage > prefers-color-scheme > light. */
      (function () {
        try {
          var stored = localStorage.getItem('opencv:theme') ?? localStorage.getItem('cveaver:theme');
          var t = (stored === 'dark' || stored === 'light')
            ? stored
            : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
